name: Warden

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write

jobs:
  warden:
    if: >-
      github.event.pull_request.user.type != 'Bot' ||
      contains(fromJSON('["fields-grove[bot]","fields-education-triage-autofixer[bot]"]'), github.event.pull_request.user.login) ||
      contains(github.event.pull_request.user.login, 'opencode')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 65
    steps:
      - name: Detect current PR state
        id: pr-state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          draft="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.draft')"
          echo "draft=${draft}" >> "$GITHUB_OUTPUT"
          echo "Current PR draft state: ${draft}"

      - name: Skip draft PR
        if: steps.pr-state.outputs.draft == 'true'
        run: echo "Skipping Warden for draft pull request."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.pr-state.outputs.draft == 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: ${{ steps.pr-state.outputs.draft == 'false' && vars.WARDEN_APP_CLIENT_ID != '' }}
        id: app-token
        with:
          client-id: ${{ vars.WARDEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARDEN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.pr-state.outputs.draft == 'false'
        with:
          repository: Fields-Education/.github
          path: .warden-org
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.pr-state.outputs.draft == 'false'
        with:
          node-version: "24"

      - uses: Destreyf/warden@d23fa6ab1921e7e636aa5c7045bb04b56c3913e5 # Pi model selector fix
        if: steps.pr-state.outputs.draft == 'false'
        id: warden
        timeout-minutes: 60
        env:
          WARDEN_FIREWORKS_API_KEY: ${{ secrets.WARDEN_API_KEY }}
          WARDEN_OTLP_ENDPOINT: ${{ secrets.WARDEN_OTLP_ENDPOINT }}
          WARDEN_OTLP_HEADER: ${{ secrets.WARDEN_OTLP_HEADER }}
          WARDEN_SENTRY_DSN: ${{ secrets.WARDEN_SENTRY_DSN }}
          OTEL_METRICS_EXPORTER: otlp
          OTEL_LOGS_EXPORTER: otlp
          OTEL_TRACES_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.WARDEN_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.WARDEN_OTLP_HEADER }}
          OTEL_LOG_TOOL_DETAILS: "1"
          OTEL_LOG_USER_PROMPTS: "0"
          OTEL_LOG_TOOL_CONTENT: "0"
          OTEL_LOG_RAW_API_BODIES: "0"
          OTEL_RESOURCE_ATTRIBUTES: service.name=warden,service.namespace=github-actions,deployment.environment=ci,github.repository=${{ github.repository }},github.workflow=${{ github.workflow }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          base-config-path: .warden-org/warden-base.toml
          report-on: medium
          request-changes: true
          parallel: 4

  cleanup-warden-checks:
    if: ${{ always() && needs.warden.result != 'success' && needs.warden.result != 'skipped' }}
    needs: warden
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: ${{ vars.WARDEN_APP_CLIENT_ID != '' }}
        id: cleanup-token
        with:
          client-id: ${{ vars.WARDEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARDEN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Complete stale Warden checks
        env:
          GH_TOKEN: ${{ steps.cleanup-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_CONCLUSION: ${{ needs.warden.result == 'cancelled' && 'cancelled' || 'failure' }}
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          check_run_ids="$({
            gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
              --jq '.check_runs[] | select(.status != "completed" and (.name == "warden" or (.name | startswith("warden: ")))) | .id'
          })"

          if [ -z "${check_run_ids}" ]; then
            echo "No stale Warden checks found."
            exit 0
          fi

          while IFS= read -r check_run_id; do
            [ -n "${check_run_id}" ] || continue
            echo "Completing stale Warden check ${check_run_id} as ${CHECK_CONCLUSION}."
            gh api --method PATCH "repos/${GH_REPO}/check-runs/${check_run_id}" \
              -f status=completed \
              -f conclusion="${CHECK_CONCLUSION}" \
              -f completed_at="${completed_at}" \
              -f 'output[title]=Warden did not complete' \
              -f 'output[summary]=Warden failed, timed out, or lost runner communication before completing this check. See the Warden workflow run for details.'
          done <<< "${check_run_ids}"
