name: Warden

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write

jobs:
  warden:
    if: >-
      github.event.pull_request.draft == false &&
      (
        github.event.pull_request.user.type != 'Bot' ||
        contains(fromJSON('["fields-grove[bot]","fields-education-triage-autofixer[bot]"]'), github.event.pull_request.user.login) ||
        contains(github.event.pull_request.user.login, 'opencode')
      )
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: ${{ vars.WARDEN_APP_CLIENT_ID != '' }}
        id: app-token
        with:
          client-id: ${{ vars.WARDEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARDEN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Fields-Education/.github
          path: .warden-org
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: main

      - uses: getsentry/warden@0aea651561cd820aceba6d1c7d624a1ad2b6688e # v0.34.0
        id: warden
        timeout-minutes: 60
        env:
          ANTHROPIC_API_KEY: ${{ secrets.WARDEN_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.WARDEN_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.WARDEN_MODEL }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.WARDEN_SMALL_FAST_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.WARDEN_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.WARDEN_DEFAULT_HAIKU_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.WARDEN_DEFAULT_OPUS_MODEL }}
          WARDEN_MODEL: ${{ vars.WARDEN_MODEL }}
          WARDEN_OTLP_ENDPOINT: ${{ secrets.WARDEN_OTLP_ENDPOINT }}
          WARDEN_OTLP_HEADER: ${{ secrets.WARDEN_OTLP_HEADER }}
          WARDEN_SENTRY_DSN: ${{ secrets.WARDEN_SENTRY_DSN }}
          WARDEN_ANTHROPIC_API_KEY: ${{ secrets.WARDEN_API_KEY }}
          CLAUDE_CODE_ENABLE_TELEMETRY: "1"
          CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
          OTEL_METRICS_EXPORTER: otlp
          OTEL_LOGS_EXPORTER: otlp
          OTEL_TRACES_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.WARDEN_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.WARDEN_OTLP_HEADER }}
          OTEL_LOG_TOOL_DETAILS: "1"
          OTEL_LOG_USER_PROMPTS: "0"
          OTEL_LOG_TOOL_CONTENT: "0"
          OTEL_LOG_RAW_API_BODIES: "0"
          OTEL_RESOURCE_ATTRIBUTES: service.name=warden,service.namespace=github-actions,deployment.environment=ci,github.repository=${{ github.repository }},github.workflow=${{ github.workflow }}
        with:
          anthropic-api-key: ${{ secrets.WARDEN_API_KEY }}
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          base-config-path: .warden-org/warden-base.toml
          report-on: medium
          request-changes: true
          parallel: 8

  cleanup-warden-checks:
    if: ${{ always() && needs.warden.result != 'success' && needs.warden.result != 'skipped' }}
    needs: warden
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: ${{ vars.WARDEN_APP_CLIENT_ID != '' }}
        id: cleanup-token
        with:
          client-id: ${{ vars.WARDEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARDEN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Complete stale Warden checks
        env:
          GH_TOKEN: ${{ steps.cleanup-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_CONCLUSION: ${{ needs.warden.result == 'cancelled' && 'cancelled' || 'failure' }}
        run: |
          set -euo pipefail

          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          check_run_ids="$({
            gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
              --jq '.check_runs[] | select(.status != "completed" and (.name == "warden" or (.name | startswith("warden: ")))) | .id'
          })"

          if [ -z "${check_run_ids}" ]; then
            echo "No stale Warden checks found."
            exit 0
          fi

          while IFS= read -r check_run_id; do
            [ -n "${check_run_id}" ] || continue
            echo "Completing stale Warden check ${check_run_id} as ${CHECK_CONCLUSION}."
            gh api --method PATCH "repos/${GH_REPO}/check-runs/${check_run_id}" \
              -f status=completed \
              -f conclusion="${CHECK_CONCLUSION}" \
              -f completed_at="${completed_at}" \
              -f 'output[title]=Warden did not complete' \
              -f 'output[summary]=Warden failed, timed out, or lost runner communication before completing this check. See the Warden workflow run for details.'
          done <<< "${check_run_ids}"
