name: Warden

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write

jobs:
  warden:
    if: >-
      github.event.pull_request.user.type != 'Bot' ||
      contains(fromJSON('["fields-grove[bot]","fields-education-triage-autofixer[bot]"]'), github.event.pull_request.user.login) ||
      contains(github.event.pull_request.user.login, 'opencode')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - name: Detect current PR state
        id: pr-state
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # One call yields the live draft state, whether the explicit Warden
          # opt-in label is present, and whether the shared reviewer kill
          # switch is present. Label matching is case-insensitive.
          pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '"\(.draft) \([.labels[]?.name | ascii_downcase] | any(. == "warden:on")) \([.labels[]?.name | ascii_downcase] | any(. == "reviewer:off"))"')"
          read -r draft warden_on reviewer_off <<< "${pr_state}"

          proceed=true
          reason=""
          if [ "${draft}" = "true" ]; then
            proceed=false
            reason="draft"
          elif [ "${reviewer_off}" = "true" ]; then
            proceed=false
            reason="reviewer-off"
          elif [ "${warden_on}" != "true" ]; then
            proceed=false
            reason="label-required"
          fi

          {
            echo "draft=${draft}"
            echo "proceed=${proceed}"
            echo "reason=${reason}"
          } >> "$GITHUB_OUTPUT"

          echo "Current PR draft state: ${draft}"
          echo "Warden opt-in label (warden:on) present: ${warden_on}"
          echo "Shared skip label (reviewer:off) present: ${reviewer_off}"
          echo "Proceed with Warden: ${proceed}"

      - name: Skip Warden
        if: steps.pr-state.outputs.proceed != 'true'
        env:
          SKIP_REASON: ${{ steps.pr-state.outputs.reason }}
        run: |
          case "${SKIP_REASON}" in
            draft)
              echo "Skipping Warden for draft pull request."
              ;;
            reviewer-off)
              echo "Skipping Warden: the shared 'reviewer:off' label disables automated review for this pull request."
              echo "Remove 'reviewer:off', add 'warden:on', and re-run this workflow (or push a new commit) to re-enable."
              ;;
            label-required)
              echo "Skipping Warden: the 'warden:on' label is required for this pull request."
              echo "Add the label (or comment '/warden run') and re-run this workflow (or push a new commit) to enable."
              ;;
            *)
              echo "Skipping Warden."
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr-state.outputs.proceed == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Incremental mode compares against the previous run's head SHA via
          # local git history; the baseline commit must be present in the
          # checkout, so fetch the full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr-state.outputs.proceed == 'true'
        with:
          repository: Fields-Education/.github
          path: .warden-org
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.pr-state.outputs.proceed == 'true'
        with:
          node-version: "24"

      - name: Install agent skill dependencies
        if: ${{ steps.pr-state.outputs.proceed == 'true' && hashFiles('agents.toml') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: npx --yes @sentry/dotagents install

      - name: Analyze
        uses: Destreyf/warden@incremental-action-dist # incremental-action-dist
        if: steps.pr-state.outputs.proceed == 'true'
        id: warden-analyze
        timeout-minutes: 105
        env:
          WARDEN_FIREWORKS_API_KEY: ${{ secrets.WARDEN_API_KEY }}
          WARDEN_OTLP_ENDPOINT: ${{ secrets.WARDEN_OTLP_ENDPOINT }}
          WARDEN_OTLP_HEADER: ${{ secrets.WARDEN_OTLP_HEADER }}
          WARDEN_SENTRY_DSN: ${{ secrets.WARDEN_SENTRY_DSN }}
          OTEL_METRICS_EXPORTER: otlp
          OTEL_LOGS_EXPORTER: otlp
          OTEL_TRACES_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.WARDEN_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.WARDEN_OTLP_HEADER }}
          OTEL_LOG_TOOL_DETAILS: "1"
          OTEL_LOG_USER_PROMPTS: "0"
          OTEL_LOG_TOOL_CONTENT: "0"
          OTEL_LOG_RAW_API_BODIES: "0"
          OTEL_RESOURCE_ATTRIBUTES: service.name=warden,service.namespace=github-actions,deployment.environment=ci,github.repository=${{ github.repository }},github.workflow=${{ github.workflow }}
        with:
          mode: analyze
          github-token: ${{ github.token }}
          base-config-path: .warden-org/warden-base.toml
          parallel: 4
          # Initial run reviews everything; subsequent runs review only changes
          # since the last completed incremental run for this PR. Must match the
          # Report step's incremental setting or the report step fails.
          incremental: true

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: ${{ steps.pr-state.outputs.proceed == 'true' && vars.WARDEN_APP_CLIENT_ID != '' }}
        id: app-token
        with:
          client-id: ${{ vars.WARDEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.WARDEN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Report
        uses: Destreyf/warden@incremental-action-dist # incremental-action-dist
        if: steps.pr-state.outputs.proceed == 'true'
        id: warden-report
        timeout-minutes: 10
        env:
          WARDEN_OTLP_ENDPOINT: ${{ secrets.WARDEN_OTLP_ENDPOINT }}
          WARDEN_OTLP_HEADER: ${{ secrets.WARDEN_OTLP_HEADER }}
          WARDEN_SENTRY_DSN: ${{ secrets.WARDEN_SENTRY_DSN }}
          OTEL_METRICS_EXPORTER: otlp
          OTEL_LOGS_EXPORTER: otlp
          OTEL_TRACES_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.WARDEN_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.WARDEN_OTLP_HEADER }}
          OTEL_LOG_TOOL_DETAILS: "1"
          OTEL_LOG_USER_PROMPTS: "0"
          OTEL_LOG_TOOL_CONTENT: "0"
          OTEL_LOG_RAW_API_BODIES: "0"
          OTEL_RESOURCE_ATTRIBUTES: service.name=warden,service.namespace=github-actions,deployment.environment=ci,github.repository=${{ github.repository }},github.workflow=${{ github.workflow }}
        with:
          mode: report
          findings-file: ${{ steps.warden-analyze.outputs.findings-file }}
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          base-config-path: .warden-org/warden-base.toml
          report-on: medium
          request-changes: true
          # Must match the Analyze step: the report step validates that the
          # findings file's incremental scope matches its own incremental input.
          incremental: true
