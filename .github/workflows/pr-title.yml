name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conform:
    name: PR Title
    if: github.event.pull_request.draft == false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            .conform-pr-title.yaml
            .conform-pr-title.yml
            .conform.yaml
            .conform.yml
            mise.toml
          sparse-checkout-cone-mode: false

      - name: Detect target mise config
        id: target-mise
        run: |
          set -euo pipefail

          if [ -f mise.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found mise.toml in target repository"
            exit 0
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "No mise.toml found in target repository; falling back to workflow source repository"

      - name: Resolve workflow source
        if: steps.target-mise.outputs.exists != 'true'
        id: workflow-source
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail

          node <<'JS'
          const fs = require("node:fs");

          const workflowRef = process.env.WORKFLOW_REF || "";
          const marker = "/.github/workflows/";
          const markerIndex = workflowRef.indexOf(marker);
          const refIndex = workflowRef.lastIndexOf("@");

          if (markerIndex === -1 || refIndex === -1 || refIndex < markerIndex) {
            throw new Error(`Could not resolve workflow source from github.workflow_ref: ${workflowRef}`);
          }

          const repository = workflowRef.slice(0, markerIndex);
          const ref = workflowRef.slice(refIndex + 1);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `repository=${repository}\nref=${ref}\n`);
          console.log(`Resolved workflow source as ${repository}@${ref}`);
          JS

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.target-mise.outputs.exists != 'true'
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.ref }}
          path: .workflow-source
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false

      - name: Prepare PR title Conform config
        id: conform-config
        run: |
          set -euo pipefail

          write_fallback_config() {
            cat > .conform.yaml <<'EOF'
          policies:
            - type: commit
              spec:
                header:
                  length: 89
                  imperative: false
                  case: lower
                  invalidLastCharacters: .
                conventional:
                  types:
                    - feat
                    - fix
                    - perf
                    - refactor
                    - docs
                    - style
                    - test
                    - build
                    - ci
                    - chore
                    - revert
                  scopes:
                    - .*
                  descriptionLength: 89
          EOF
          }

          if [ -f .conform-pr-title.yaml ]; then
            cp .conform-pr-title.yaml .conform.yaml
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "mode=dedicated" >> "$GITHUB_OUTPUT"
            echo "source=.conform-pr-title.yaml" >> "$GITHUB_OUTPUT"
            echo "Using dedicated PR title Conform config from .conform-pr-title.yaml"
            exit 0
          fi

          if [ -f .conform-pr-title.yml ]; then
            cp .conform-pr-title.yml .conform.yaml
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "mode=dedicated" >> "$GITHUB_OUTPUT"
            echo "source=.conform-pr-title.yml" >> "$GITHUB_OUTPUT"
            echo "Using dedicated PR title Conform config from .conform-pr-title.yml"
            exit 0
          fi

          source_file=""
          if [ -f .conform.yaml ]; then
            source_file=".conform.yaml"
          elif [ -f .conform.yml ]; then
            source_file=".conform.yml"
          fi

          if [ -z "$source_file" ]; then
            write_fallback_config
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "mode=fallback" >> "$GITHUB_OUTPUT"
            echo "source=shared-default" >> "$GITHUB_OUTPUT"
            echo "Using shared default PR title Conform config. Add .conform-pr-title.yaml for repo-specific title rules, or add .conform.yaml/.yml to derive rules from your commit policy."
            exit 0
          fi

          if ruby - "$source_file" .conform.yaml <<'RUBY'
          require "yaml"

          source = ARGV.fetch(0)
          target = ARGV.fetch(1)

          def filter_hash(hash, allowed_keys)
            allowed_keys.each_with_object({}) do |key, filtered|
              filtered[key] = hash[key] if hash.key?(key)
            end
          end

          config = YAML.safe_load(
            File.read(source),
            permitted_classes: [],
            permitted_symbols: [],
            aliases: true,
            filename: source,
            fallback: {},
          ) || {}

          ignored = []
          policies = Array(config["policies"]).each_with_object([]) do |policy, derived_policies|
            next unless policy.is_a?(Hash)

            type = policy["type"]
            if type != "commit"
              ignored << "policy type #{type.inspect}"
              next
            end

            spec = policy["spec"]
            next unless spec.is_a?(Hash)

            derived = {}

            if (header = spec["header"]).is_a?(Hash)
              filtered_header = filter_hash(header, %w[length imperative case invalidLastCharacters jira])
              derived["header"] = filtered_header unless filtered_header.empty?

              ignored_header = header.keys - filtered_header.keys
              ignored.concat(ignored_header.sort.map { |key| "header.#{key}" })
            end

            if (conventional = spec["conventional"]).is_a?(Hash) && !conventional.empty?
              derived["conventional"] = conventional
            end

            if (spellcheck = spec["spellcheck"]).is_a?(Hash) && !spellcheck.empty?
              derived["spellcheck"] = spellcheck
            end

            ignored_top_level = spec.keys - %w[header conventional spellcheck body dco gpg maximumOfOneCommit]
            ignored.concat(%w[body dco gpg maximumOfOneCommit].select { |key| spec.key?(key) })
            ignored.concat(ignored_top_level.sort)

            next if derived.empty?

            derived_policies << {
              "type" => "commit",
              "spec" => derived,
            }
          end

          if policies.empty?
            warn "No title-safe commit rules found in #{source}"
            exit 3
          end

          File.write(target, { "policies" => policies }.to_yaml)

          ignored.uniq.sort.each do |entry|
            warn "Ignoring #{entry} for PR title validation"
          end
          RUBY
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "mode=derived" >> "$GITHUB_OUTPUT"
            echo "source=$source_file" >> "$GITHUB_OUTPUT"
            echo "Derived PR title Conform config from $source_file"
            exit 0
          fi

          ruby_status=$?
          if [ "$ruby_status" -ne 3 ]; then
            exit "$ruby_status"
          fi

          write_fallback_config
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "mode=fallback" >> "$GITHUB_OUTPUT"
          echo "source=$source_file" >> "$GITHUB_OUTPUT"
          echo "Using shared default PR title Conform config because $source_file does not define title-safe commit rules. Add .conform-pr-title.yaml for repo-specific title rules, or update .conform.yaml/.yml to derive PR title rules from commit policy."
          exit 0

      - name: Read conform version
        if: steps.conform-config.outputs.exists == 'true'
        id: conform-version
        run: |
          set -euo pipefail

          node <<'JS'
          const fs = require("node:fs");

          function readConformVersion(path) {
            const mise = fs.readFileSync(path, "utf8");
            let inTools = false;

            for (const rawLine of mise.split(/\r?\n/)) {
              const section = rawLine.match(/^\s*\[([^\]]+)\]\s*(?:#.*)?$/);
              if (section) {
                inTools = section[1].trim() === "tools";
                continue;
              }

              if (!inTools) {
                continue;
              }

              const line = rawLine.replace(/\s+#.*$/, "").trim();
              const match = line.match(/^(?:"conform"|conform)\s*=\s*"([^"]+)"\s*$/);
              if (match) {
                return match[1];
              }
            }

            throw new Error(`Could not find conform = "..." in [tools] of ${path}`);
          }

          const candidates = [
            { path: "mise.toml", source: "target repository" },
            { path: ".workflow-source/mise.toml", source: "workflow source repository" },
          ];

          const candidate = candidates.find(({ path }) => fs.existsSync(path));
          if (!candidate) {
            throw new Error("Could not find mise.toml in target repository or workflow source repository");
          }

          const version = readConformVersion(candidate.path);
          const tag = version.startsWith("v") ? version : `v${version}`;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${tag}\n`);
          console.log(`Using conform ${tag} from ${candidate.source} (${candidate.path})`);
          JS

      - name: Install conform
        if: steps.conform-config.outputs.exists == 'true'
        env:
          CONFORM_VERSION: ${{ steps.conform-version.outputs.version }}
        run: |
          set -euo pipefail

          asset="conform-linux-amd64"
          install_dir="$HOME/.local/bin"
          download_dir="${RUNNER_TEMP}/conform"

          mkdir -p "$install_dir" "$download_dir"

          curl -fsSL -o "$download_dir/$asset" "https://github.com/siderolabs/conform/releases/download/${CONFORM_VERSION}/${asset}"
          curl -fsSL -o "$download_dir/sha256sum.txt" "https://github.com/siderolabs/conform/releases/download/${CONFORM_VERSION}/sha256sum.txt"

          (
            cd "$download_dir"
            grep -E "  ${asset}$" sha256sum.txt | sha256sum -c -
          )

          install -m 0755 "$download_dir/$asset" "$install_dir/conform"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Validate PR title
        if: steps.conform-config.outputs.exists == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          tmp_file="${RUNNER_TEMP}/pr-title.txt"
          printf '%s\n' "$PR_TITLE" > "$tmp_file"
          conform enforce --commit-msg-file "$tmp_file"
